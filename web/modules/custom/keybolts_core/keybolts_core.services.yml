services:
  keybolts_core.text_normalizer:
    class: Drupal\keybolts_core\Service\TextNormalizer
  keybolts_core.slug_generator:
    class: Drupal\keybolts_core\Service\SlugGenerator
    arguments: ['@keybolts_core.text_normalizer', '@entity_type.manager']
  keybolts_core.variant_matrix:
    class: Drupal\keybolts_core\Service\VariantMatrixBuilder
    arguments: ['@entity_type.manager', '@path_alias.manager']
  keybolts_core.product_query:
    class: Drupal\keybolts_core\Service\ProductQuery
    arguments: ['@entity_type.manager']
  keybolts_core.product_facets:
    class: Drupal\keybolts_core\Service\ProductFacetBuilder
    arguments: ['@entity_type.manager']
  keybolts_core.recaptcha:
    class: Drupal\keybolts_core\Service\RecaptchaVerifier
    arguments: ['@http_client', '@settings', '@logger.factory', '@state', '@config.factory']
  keybolts_core.editor_theme_negotiator:
    class: Drupal\keybolts_core\Theme\EditorThemeNegotiator
    arguments: ['@current_user', '@router.admin_context']
    tags:
      # Above Drupal's own admin negotiator (100) so the editor's theme wins.
      - { name: theme_negotiator, priority: 1000 }
