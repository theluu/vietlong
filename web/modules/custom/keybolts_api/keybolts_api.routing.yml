keybolts_api.site:
  path: '/api/v1/site'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::site'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.products:
  path: '/api/v1/products'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\ProductController::list'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.product_suggest:
  path: '/api/v1/products/suggest'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\ProductController::suggest'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.product_detail:
  path: '/api/v1/products/{slug}'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\ProductController::detail'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.homepage:
  path: '/api/v1/homepage'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\HomepageController::index'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.branches:
  path: '/api/v1/branches'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::branches'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.page:
  path: '/api/v1/page/{key}'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::page'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.articles:
  path: '/api/v1/articles'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::articles'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.article_detail:
  path: '/api/v1/articles/{slug}'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::article'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.projects:
  path: '/api/v1/projects'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::projects'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.project_detail:
  path: '/api/v1/projects/{slug}'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\PageController::project'
  methods: [GET]
  requirements:
    _permission: 'access content'

keybolts_api.contact:
  path: '/api/v1/contact'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\ContactController::submit'
  methods: [POST]
  requirements:
    _permission: 'access content'

keybolts_api.category:
  path: '/api/v1/categories/{tid}'
  defaults:
    _controller: '\Drupal\keybolts_api\Controller\CategoryController::show'
  methods: [GET]
  requirements:
    _permission: 'access content'
    tid: '\d+'
