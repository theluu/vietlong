services:
  keybolts_api.product_serializer:
    class: Drupal\keybolts_api\Serializer\ProductSerializer
    arguments: ['@entity_type.manager', '@path_alias.manager', '@keybolts_api.image_serializer']
  keybolts_api.branch_serializer:
    class: Drupal\keybolts_api\Serializer\BranchSerializer
    arguments: ['@entity_type.manager']
  keybolts_api.page_serializer:
    class: Drupal\keybolts_api\Serializer\PageSerializer
    arguments: ['@file_url_generator']
  keybolts_api.article_serializer:
    class: Drupal\keybolts_api\Serializer\ArticleSerializer
    arguments: ['@entity_type.manager', '@path_alias.manager', '@keybolts_api.product_serializer', '@keybolts_api.image_serializer']
  keybolts_api.project_serializer:
    class: Drupal\keybolts_api\Serializer\ProjectSerializer
    arguments: ['@entity_type.manager', '@keybolts_api.image_serializer']
  keybolts_api.home_serializer:
    class: Drupal\keybolts_api\Serializer\HomeSerializer
    arguments: ['@entity_type.manager', '@file_url_generator']
  keybolts_api.site_serializer:
    class: Drupal\keybolts_api\Serializer\SiteSerializer
    arguments: ['@entity_type.manager', '@menu.link_tree', '@keybolts_core.recaptcha']
  keybolts_api.image_serializer:
    class: Drupal\keybolts_api\Serializer\ImageSerializer
    arguments: ['@entity_type.manager', '@file_url_generator']
  keybolts_api.exception_subscriber:
    class: Drupal\keybolts_api\EventSubscriber\ApiExceptionSubscriber
    tags:
      - { name: event_subscriber }
