_core:
  default_config_hash: 6A_AsNxy1stL6FWrHMo-FQaoy4ZJFYcZYA2hySobR70
enabled_entity_types:
  - user
punctuation:
  hyphen: 1
verbose: false
separator: '-'
max_length: 150
max_component_length: 100
transliterate: true
reduce_ascii: false
case: true
# Emptied on purpose. This is Drupal's English stop-word list, and it strips
# those words out of the slug after transliteration — so "Khóa Thẻ Từ Khách
# Sạn" lost "thẻ" (→ "the") and "Mắt Thần" lost "thần" (→ "than"), giving URLs
# that no longer match the old site. Vietnamese has no use for it.
ignore_words: ''
update_action: 2
safe_tokens:
  - alias
  - path
  - join-path
  - login-url
  - url
  - url-brief
