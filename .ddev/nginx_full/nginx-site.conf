# ddev drupal11 config — CUSTOMISED for the headless Keybolts setup.
#
# ddev regenerates this file whenever it contains its generated-marker line.
# That marker is deliberately absent here so ddev leaves the file alone —
# never reintroduce it, not even inside a comment, or this config is lost.
#
# The public pages are a Nuxt SSR app; Drupal is the API and the admin UI.
# Both are served from one origin so https://vietlong.ddev.site/ shows the
# same site as http://localhost:3000/.
#
#   /                      -> Nuxt   (host.docker.internal:3100)
#   /_nuxt/, /_fonts/, …   -> Nuxt   (its assets and Vite dev endpoints)
#   /api/, /admin, /user…  -> Drupal
#   /sites/default/files/  -> Drupal (product images the API links to)
#
# TWO PRIORITY TRAPS, both handled with `^~`, which outranks regex locations:
#   1. Drupal's deny-dotfiles rule `/\.(?!well-known\/)` would block Vite's
#      dev URLs, which contain paths like /node_modules/.vite/deps/.
#   2. A regex rule for .js/.css would claim Nuxt's assets before the proxy
#      ever saw them.
#
# Nuxt must be running (`cd frontend && npm run dev`), otherwise `/` returns
# 502. Every Drupal URL keeps working regardless.
#
# PORT 3100, NOT 3000, and bound to 0.0.0.0 — deliberately. Nuxt's default bind
# is loopback only, which the web container cannot reach, and port 3000 on this
# machine is already published by another Docker project. Both together meant
# this proxy silently served the other project's site.

upstream nuxt {
    server host.docker.internal:3100;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    root /var/www/html/web;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    index index.php index.htm index.html;

    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    # Inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_buffer_size 32k;
    proxy_buffers 16 32k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # ---------------------------------------------------------------------
    # Nuxt — the public site
    # ---------------------------------------------------------------------

    location / {
        proxy_pass http://nuxt;
    }

    location ^~ /_nuxt/  { proxy_pass http://nuxt; }
    location ^~ /_fonts/ { proxy_pass http://nuxt; }
    location ^~ /_ipx/   { proxy_pass http://nuxt; }
    location ^~ /_vite/  { proxy_pass http://nuxt; }
    location ^~ /__nuxt  { proxy_pass http://nuxt; }
    location ^~ /@vite/  { proxy_pass http://nuxt; }
    location ^~ /@fs/    { proxy_pass http://nuxt; }
    location ^~ /@id/    { proxy_pass http://nuxt; }

    # ---------------------------------------------------------------------
    # Drupal — API, admin and anything it owns
    # ---------------------------------------------------------------------

    location ^~ /api/       { try_files $uri /index.php?$query_string; }
    location ^~ /jsonapi    { try_files $uri /index.php?$query_string; }
    location ^~ /admin      { try_files $uri /index.php?$query_string; }
    location ^~ /user       { try_files $uri /index.php?$query_string; }
    location ^~ /node       { try_files $uri /index.php?$query_string; }
    location ^~ /taxonomy   { try_files $uri /index.php?$query_string; }
    location ^~ /media      { try_files $uri /index.php?$query_string; }
    location ^~ /comment    { try_files $uri /index.php?$query_string; }
    location ^~ /search     { try_files $uri /index.php?$query_string; }
    location ^~ /filter     { try_files $uri /index.php?$query_string; }
    location ^~ /batch      { try_files $uri /index.php?$query_string; }
    location ^~ /cron       { try_files $uri /index.php?$query_string; }
    location ^~ /oauth      { try_files $uri /index.php?$query_string; }
    location ^~ /toolbar    { try_files $uri /index.php?$query_string; }
    location ^~ /contextual { try_files $uri /index.php?$query_string; }
    location ^~ /quickedit  { try_files $uri /index.php?$query_string; }
    location ^~ /entity_reference_autocomplete { try_files $uri /index.php?$query_string; }

    # Image styles must be generated by Drupal on first request.
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    ## Regular private file serving (i.e. handled by Drupal).
    location ^~ /system/files/ {
        log_not_found off;
        access_log off;
        expires 30d;
        try_files $uri @rewrite;
    }

    location ^~ /system/ { try_files $uri /index.php?$query_string; }

    # Drupal's own assets and the public files directory. Product images are
    # absolute URLs into /sites/default/files/, so this must reach disk.
    location ^~ /sites/     { try_files $uri @rewrite; }
    location ^~ /core/      { try_files $uri @rewrite; }
    location ^~ /modules/   { try_files $uri @rewrite; }
    location ^~ /themes/    { try_files $uri @rewrite; }
    location ^~ /profiles/  { try_files $uri @rewrite; }
    location ^~ /libraries/ { try_files $uri @rewrite; }

    location @rewrite {
        rewrite ^ /index.php;
    }

    # pass the PHP scripts to FastCGI server listening on socket
    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
        fastcgi_pass_header "X-Accel-Buffering";
        fastcgi_pass_header "X-Accel-Charset";
        fastcgi_pass_header "X-Accel-Expires";
        fastcgi_pass_header "X-Accel-Limit-Rate";
        fastcgi_pass_header "X-Accel-Redirect";
    }

    # Prevent clients from accessing hidden files (starting with a dot).
    # Access to `/.well-known/` is allowed.
    location ~* /\.(?!well-known\/) {
        deny all;
    }

    # Prevent clients from accessing backup/config/source files
    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
